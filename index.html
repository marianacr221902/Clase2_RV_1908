<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Práctica VR — A-Frame</title>
  <!-- A-Frame 1.8.0 (última versión estable). Con esta sola línea ya tienes VR. -->
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
</head>
<body>
  <!--
    ESCENA VR COMPLETA. Cómo probarla:
      • En computadora: clic derecho sobre el archivo en VS Code → "Open with Live Server".
        Arrastra el mouse para mirar; teclas W A S D para moverte.
      • En el celular: abre la misma URL y toca el ícono de gafas (abajo a la derecha)
        para el modo Cardboard.
    Úsala como base para: P1 (disección de una experiencia), P4 (interacción), P5 (mini-app VR).
  -->
  <a-scene>
    <!-- Fondo -->
    <a-sky color="#c0fcf9"></a-sky>

    <!-- Piso -->
    <a-plane position="0 0 -5" rotation="-90 0 0" scale="1.5 1.5 1.5" width="4" height="4" color="#8af0c0"></a-plane>

    <!-- Geometrías primitivas (la base del modelado 3D) -->
    <!-- La caja gira cuando le haces clic con el cursor: base de la práctica de interacción P4 -->
    <a-box id="caja" position="0 1 -3.75" rotation="0 0 0" scale="1.7 0.9 0.5" color="#fb0909"></a-box>
    <a-box id="caja" position="-0.35 1 -3.4" rotation="0 0 0" scale="0.3 0.5 0.2" color="#f0f25f"
          animation__click="property: rotation; to: 0 405 0; startEvents: click; dur: 600"></a-box>
    <a-box id="caja" position="0.35 1 -3.4" rotation="0 0 0" scale="0.3 0.5 0.2" color="#f0f25f"
          animation__click="property: rotation; to: 0 405 0; startEvents: click; dur: 600"></a-box>
    <a-sphere position="0 3 -5" rotation="0 0 0" scale="1 1 1" radius="1.15" color="#000000"></a-sphere>
    <a-sphere position="1.33 4.23 -5" rotation="0 0 0" scale="1 1 1" radius="0.85" color="#000000"></a-sphere>
    <a-sphere position="-1.33 4.23 -5" rotation="0 0 0" scale="1 1 1"radius="0.85" color="#000000"></a-sphere>
    <a-cylinder position="0 1 -5" rotation="0 0 0" scale="1 1 1" radius="1" height="1.8" color="#000000"></a-cylinder>

    <!-- Texto flotante -->
    <a-text value="Ejercicio 1: Modificación Figuras Geométricas" position="-1.6 -0.4 -3" color="#d265e6" width="9"></a-text>

    <!-- Cámara con cursor: apunta a la caja y haz clic para que gire -->
    <a-entity camera look-controls wasd-controls>
      <a-cursor color="#333"></a-cursor>
    </a-entity>
  </a-scene>
</body>
</html>
